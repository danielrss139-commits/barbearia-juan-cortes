<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0E0E0E">
  <meta name="robots" content="noindex, nofollow">
  <title>Agendamento temporariamente indisponível · Barbearia Juan Cortes</title>
  <style>
    :root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;background:#0e0e0e;color:#f3f0ec}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 50% 35%,#29221f 0%,#151413 42%,#0e0e0e 78%)}
    main{width:min(100%,440px);text-align:center;padding:42px 28px;border:1px solid #ffffff18;border-radius:22px;background:#ffffff08;box-shadow:0 24px 80px #0008;backdrop-filter:blur(14px)}
    .mark{width:42px;height:1px;background:#b58b69;margin:0 auto 30px}
    .eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#b99a82;margin:0 0 18px}
    h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(27px,7vw,35px);line-height:1.15;margin:0 0 16px}
    p{font-size:14px;line-height:1.75;color:#b9b2ac;margin:0}
    .foot{margin-top:34px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#766d66}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <p class="eyebrow">Barbearia Juan Cortes</p>
    <h1>Agendamento temporariamente indisponível</h1>
    <p>No momento, a agenda online está pausada. Para informações sobre horários, entre em contato diretamente com a barbearia.</p>
    <div class="foot">Cabula · Salvador</div>
  </main>
</body>
</html>
