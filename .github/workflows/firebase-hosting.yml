name: Deploy Firebase Hosting
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy
        if: ${{ env.FIREBASE_TOKEN != '' }}
        run: npx -y firebase-tools@15 deploy --only hosting --project barbearia-juan-cortes --non-interactive
